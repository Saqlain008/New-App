<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Milk Ledger</title>
<style>
  :root{ --cream:#FBF7EF; --forest:#1B4332; --gold:#C99A2E; --ink:#232A20; --muted:#6E7566; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex; align-items:center; justify-content:center; min-height:100%;
    background:var(--cream); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    padding:24px; text-align:center;
  }
  .card{max-width:380px;}
  .mark{
    width:72px; height:72px; border-radius:16px; background:var(--forest);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
    font-size:34px;
  }
  h1{font-size:22px; margin:0 0 8px;}
  p{color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 20px;}
  button{
    background:var(--forest); color:#fff; border:none; border-radius:10px;
    padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:active{opacity:.85;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🥛</div>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet, so it needs a connection the first time. Once the app has loaded once, all your customers, entries, invoices and reports work fully offline.</p>
    <button onclick="location.href='./index.html'">Go to Dashboard</button>
  </div>
</body>
</html>
